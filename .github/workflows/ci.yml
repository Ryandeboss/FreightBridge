name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/analyst-ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/analyst-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/freightbridge-api/requirements.txt
            services/apex-partner-sim/requirements.txt

      - name: Install FreightBridge API dependencies
        run: python -m pip install -r services/freightbridge-api/requirements.txt

      - name: Run FreightBridge API tests
        run: python -m pytest
        working-directory: services/freightbridge-api

      - name: Install Apex simulator dependencies
        run: python -m pip install -r services/apex-partner-sim/requirements.txt

      - name: Run Apex simulator tests
        run: python -m pytest
        working-directory: services/apex-partner-sim
