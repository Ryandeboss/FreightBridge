name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  documentation-validation:
    name: Documentation validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run documentation validator tests
        run: python -m unittest discover scripts/ci/tests

      - name: Validate documentation links
        run: python scripts/ci/validate_docs.py

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/analyst-ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/analyst-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run frontend coverage tests
        run: npm run test:coverage

      - name: Build frontend
        run: npm run build

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: apps/analyst-ui/coverage

  freightbridge-api:
    name: FreightBridge API tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/freightbridge-api/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r services/freightbridge-api/requirements.txt

      - name: Run tests with coverage
        run: python -m pytest --cov=app --cov-report=term --cov-report=xml --cov-fail-under=75
        working-directory: services/freightbridge-api

      - name: Upload FreightBridge coverage
        uses: actions/upload-artifact@v4
        with:
          name: freightbridge-api-coverage
          path: services/freightbridge-api/coverage.xml

  apex-simulator:
    name: Apex simulator tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/apex-partner-sim/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r services/apex-partner-sim/requirements.txt

      - name: Run tests with coverage
        run: python -m pytest --cov=app --cov-report=term --cov-report=xml --cov-fail-under=75
        working-directory: services/apex-partner-sim

      - name: Upload Apex coverage
        uses: actions/upload-artifact@v4
        with:
          name: apex-simulator-coverage
          path: services/apex-partner-sim/coverage.xml

  midwest-simulator:
    name: Midwest simulator tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/midwest-partner-sim/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r services/midwest-partner-sim/requirements.txt

      - name: Run tests with coverage
        run: python -m pytest --cov=app --cov-report=term --cov-report=xml --cov-fail-under=70
        working-directory: services/midwest-partner-sim

      - name: Upload Midwest coverage
        uses: actions/upload-artifact@v4
        with:
          name: midwest-simulator-coverage
          path: services/midwest-partner-sim/coverage.xml

  database-regression:
    name: Database migration regression
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: freightbridge
          POSTGRES_PASSWORD: freightbridge
          POSTGRES_DB: freightbridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://freightbridge:freightbridge@localhost:5432/freightbridge_test
      DATABASE_URL: postgresql://freightbridge:freightbridge@localhost:5432/freightbridge_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/freightbridge-api/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r services/freightbridge-api/requirements.txt

      - name: Apply migrations 001-011
        run: python scripts/ci/apply_migrations.py

      - name: Run real database regression tests
        run: python -m pytest tests/test_database_regression.py
        working-directory: services/freightbridge-api

  acceptance-harness:
    name: Acceptance harness unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/acceptance/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r scripts/acceptance/requirements.txt

      - name: Run acceptance harness tests
        run: python -m pytest scripts/acceptance/tests
