name: Deployed Acceptance

on:
  workflow_dispatch:
    inputs:
      milestone:
        description: Acceptance milestone to run
        required: true
        default: milestone12
        type: choice
        options:
          - milestone12
          - milestone13
          - milestone14
          - milestone15
          - milestone16
          - milestone17
          - milestone18
          - milestone19
      load_id:
        description: Optional load ID. Leave blank to generate a fresh LOAD-prefixed ID.
        required: false
        type: string
      run_db_verification:
        description: Run optional DATABASE_URL SQL verification
        required: true
        default: false
        type: boolean
      verbose:
        description: Print safe request progress
        required: true
        default: false
        type: boolean

jobs:
  milestone12:
    name: Milestone 12 deployed acceptance
    runs-on: ubuntu-latest
    if: inputs.milestone == 'milestone12'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/acceptance/requirements.txt

      - name: Install acceptance dependencies
        run: python -m pip install -r scripts/acceptance/requirements.txt

      - name: Run Milestone 12 deployed acceptance
        env:
          APEX_BASE_URL: ${{ secrets.APEX_BASE_URL }}
          APEX_BEARER_TOKEN: ${{ secrets.APEX_BEARER_TOKEN }}
          APEX_READONLY_TOKEN: ${{ secrets.APEX_READONLY_TOKEN }}
          FREIGHTBRIDGE_BASE_URL: ${{ secrets.FREIGHTBRIDGE_BASE_URL }}
          MIDWEST_BASE_URL: ${{ secrets.MIDWEST_BASE_URL }}
          MIDWEST_BEARER_TOKEN: ${{ secrets.MIDWEST_BEARER_TOKEN }}
          MIDWEST_READONLY_TOKEN: ${{ secrets.MIDWEST_READONLY_TOKEN }}
          DATABASE_URL: ${{ inputs.run_db_verification && secrets.DATABASE_URL || '' }}
        run: |
          args=()
          if [ -n "${{ inputs.load_id }}" ]; then
            args+=(--load-id "${{ inputs.load_id }}")
          fi
          if [ "${{ inputs.run_db_verification }}" != "true" ]; then
            args+=(--skip-db)
          fi
          if [ "${{ inputs.verbose }}" = "true" ]; then
            args+=(--verbose)
          fi
          python scripts/acceptance/milestone12.py "${args[@]}"

